<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LILAC</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
  <header class="header">
    <video autoplay muted loop playsinline preload="auto" class="header-video">
      <source src="./videos/Lilac Homepage Video.mp4" type="video/mp4">
    </video>

    <img src="./images/Logo Gold.png" class="logo-big" alt="LILAC logo">
  </header>

  <div class="page-content">
    <div class="selection-bar">
      <button class="menu-button" id="menuButton" aria-label="Open menu">
        ☰
      </button>

      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="#" class="nav-item">HOME</a>
        <a href="#" class="nav-item">SHOP</a>
        <a href="#" class="nav-item" aria-label="Home">
          <img src="./images/Logo.png" class="logo" alt="LILAC">
        </a>
        <a href="#" class="nav-item">DATES</a>
        <a href="#" class="nav-item">MEDIA</a>
      </nav>

      <a href="#" class="mobile-logo-link" aria-label="Home">
        <img src="./images/Logo.png" class="mobile-logo" alt="LILAC">
      </a>

      <a
        href="https://instagram.com/lilac.deathcore"
        class="instagram-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img src="./images/Instagram.svg" class="instagram-icon" alt="Instagram">
      </a>
    </div>

    <div class="side-menu" id="sideMenu" aria-hidden="true">
      <button class="close-button" id="closeButton" aria-label="Close menu">
        ✕
      </button>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#">HOME</a>
        <a href="#">SHOP</a>
        <a href="#">DATES</a>
        <a href="#">MEDIA</a>
      </nav>
    </div>

    <div class="overlay" id="overlay"></div>

    <main class="content"></main>
  </div>

  <script>
  const menuButton = document.getElementById("menuButton");
  const closeButton = document.getElementById("closeButton");
  const sideMenu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  const bigLogo = document.querySelector(".logo-big");
  const selectionBar = document.querySelector(".selection-bar");

  let fadeEnd = 0;
  let logoCenterY = 0;

  function openMenu() {
    sideMenu.classList.add("open");
    sideMenu.setAttribute("aria-hidden", "false");
    overlay.classList.add("show");
  }

  function closeMenu() {
    sideMenu.classList.remove("open");
    sideMenu.setAttribute("aria-hidden", "true");
    overlay.classList.remove("show");
  }

  function setInitialLogoPosition() {
    fadeEnd = selectionBar.getBoundingClientRect().top + window.scrollY;
    logoCenterY = fadeEnd / 2;

    bigLogo.style.top = logoCenterY + "px";
  }

  function updateLogoOpacity() {
    const scrollY = window.scrollY;

    let opacity = 1 - scrollY / fadeEnd;
    opacity = Math.max(0, Math.min(1, opacity));

    bigLogo.style.opacity = opacity;
  }

  function initLogo() {
  setInitialLogoPosition();

  bigLogo.style.visibility = "visible";

  // start from 0 → fade to correct opacity
  requestAnimationFrame(() => {
    updateLogoOpacity();
  });
  }

  menuButton.addEventListener("click", openMenu);
  closeButton.addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  window.addEventListener("scroll", updateLogoOpacity);

  window.addEventListener("load", () => {
    requestAnimationFrame(initLogo);
  });

  window.addEventListener("resize", () => {
    setInitialLogoPosition();
    updateLogoOpacity();
  });
</script>
</body>
</html>

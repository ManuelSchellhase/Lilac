<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LILAC</title>

  <script>
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
  </script>

  <link rel="stylesheet" href="./style.css?v=9">
</head>
<body id="top">
  <header class="header" id="hero">
    <video autoplay muted loop playsinline preload="auto" class="header-video">
      <source src="./videos/Lilac Homepage Video.mp4" type="video/mp4">
    </video>

    <img src="./images/Logo Gold.png" class="logo-big" alt="LILAC logo">
  </header>

  <div class="page-content">
    <div class="selection-bar-placeholder" id="selectionBarPlaceholder"></div>

    <div class="selection-bar" id="selectionBar">
      <button class="menu-button" id="menuButton" aria-label="Open menu">
        ☰
      </button>

      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="#" class="nav-item home-link">HOME</a>
        <a href="#" class="nav-item shop-link">SHOP</a>
        <a href="#" class="nav-item home-link" aria-label="Home">
          <img src="./images/Logo.png" class="logo" alt="LILAC">
        </a>
        <a href="#" class="nav-item">DATES</a>
        <a href="#" class="nav-item">MEDIA</a>
      </nav>

      <a href="#" class="mobile-logo-link home-link" aria-label="Home">
        <img src="./images/Logo.png" class="mobile-logo" alt="LILAC">
      </a>

      <a
        href="https://instagram.com/lilac.deathcore"
        class="instagram-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <img src="./images/Instagram.svg" class="instagram-icon" alt="Instagram">
      </a>
    </div>

    <div class="side-menu" id="sideMenu" aria-hidden="true">
      <button class="close-button" id="closeButton" aria-label="Close menu">
        ✕
      </button>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#" class="home-link">HOME</a>
        <a href="#" class="shop-link">SHOP</a>
        <a href="#">DATES</a>
        <a href="#">MEDIA</a>
      </nav>
    </div>

    <div class="overlay" id="overlay"></div>

    <main class="content">
      <section class="shop-section" id="shop">
        <h2 class="shop-title">SHOP</h2>

        <div class="shop-grid">
          <article class="product-card">
            <a href="#" class="product-link">
              <div class="product-image-frame has-two-images">
                <div class="product-image-viewport">
                  <div class="product-image-track">
                    <img src="./images/HoodieSpine1.png" alt="Hoodie Spine front" class="product-image">
                    <img src="./images/HoodieSpine2.png" alt="Hoodie Spine back" class="product-image">
                  </div>
                </div>

                <div class="product-dots">
                  <span class="dot active"></span>
                  <span class="dot"></span>
                </div>
              </div>
            </a>
            <h3 class="product-name">Hoodie Spine</h3>
            <p class="product-price">€45.00</p>
          </article>

          <article class="product-card">
            <a href="#" class="product-link">
              <div class="product-image-frame">
                <div class="product-image-track">
                  <img src="./images/TshirtMisery.png" alt="T-Shirt Misery" class="product-image">
                </div>
              </div>
            </a>
            <h3 class="product-name">T-Shirt Misery</h3>
            <p class="product-price">€22.00</p>
          </article>

          <article class="product-card">
            <a href="#" class="product-link">
              <div class="product-image-frame has-two-images">
                <div class="product-image-viewport">
                  <div class="product-image-track">
                    <img src="./images/CDWhereEmptinessReigns1.png" alt="CD Where Emptiness Reigns cover" class="product-image">
                    <img src="./images/CDWhereEmptinessReigns2.png" alt="CD Where Emptiness Reigns inside" class="product-image">
                  </div>
                </div>

                <div class="product-dots">
                  <span class="dot active"></span>
                  <span class="dot"></span>
                </div>
              </div>
            </a>
            <h3 class="product-name">Where Emptiness Reigns CD</h3>
            <p class="product-price">€12.00</p>
          </article>
        </div>
      </section>
    </main>
  </div>

  <script>
  const menuButton = document.getElementById("menuButton");
  const closeButton = document.getElementById("closeButton");
  const sideMenu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  const bigLogo = document.querySelector(".logo-big");
  const selectionBar = document.getElementById("selectionBar");
  const selectionBarPlaceholder = document.getElementById("selectionBarPlaceholder");
  const header = document.querySelector(".header");
  const shopSection = document.getElementById("shop");

  const homeLinks = document.querySelectorAll(".home-link");
  const shopLinks = document.querySelectorAll(".shop-link");

  let fadeEnd = 0;

  function openMenu() {
    sideMenu.classList.add("open");
    sideMenu.setAttribute("aria-hidden", "false");
    overlay.classList.add("show");
  }

  function closeMenu() {
    sideMenu.classList.remove("open");
    sideMenu.setAttribute("aria-hidden", "true");
    overlay.classList.remove("show");
  }

  function updateSelectionBarPosition() {
    const scrollY = window.scrollY;
    const headerHeight = header.offsetHeight;
    const barHeight = selectionBar.offsetHeight;
    const viewportHeight = window.innerHeight;

    const naturalTop = headerHeight - scrollY;

    selectionBar.classList.remove("stick-bottom", "stick-top");
    selectionBarPlaceholder.classList.remove("active");

    if (naturalTop > viewportHeight - barHeight) {
      selectionBar.classList.add("stick-bottom");
      selectionBarPlaceholder.classList.add("active");
    } else if (naturalTop <= 0) {
      selectionBar.classList.add("stick-top");
      selectionBarPlaceholder.classList.add("active");
    }
  }

  function revealShopOnFirstScroll() {
    if (window.scrollY > 0) {
      shopSection.classList.add("revealed");
    }
  }

  function setInitialLogoSetup() {
    updateSelectionBarPosition();

    const initialBarTop = selectionBar.getBoundingClientRect().top;
    bigLogo.style.top = (initialBarTop / 2) + "px";
    fadeEnd = Math.max(initialBarTop, 1);
  }

  function updateLogoOpacity() {
    const scrollY = window.scrollY;
    let opacity = 1 - (scrollY / fadeEnd);
    opacity = Math.max(0, Math.min(1, opacity));
    bigLogo.style.opacity = opacity;
  }

  function handleScrollEffects() {
    updateSelectionBarPosition();
    updateLogoOpacity();
    revealShopOnFirstScroll();
  }

  function goToHero(event) {
    event.preventDefault();
    closeMenu();

    history.replaceState(null, "", window.location.pathname + window.location.search);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function goToShop(event) {
    event.preventDefault();
    closeMenu();

    const barHeight = selectionBar.offsetHeight;
    const shopTop = shopSection.getBoundingClientRect().top + window.scrollY - barHeight;

    history.replaceState(null, "", window.location.pathname + window.location.search);

    window.scrollTo({
      top: shopTop,
      behavior: "smooth"
    });
  }

  menuButton.addEventListener("click", openMenu);
  closeButton.addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  homeLinks.forEach(link => {
    link.addEventListener("click", goToHero);
  });

  shopLinks.forEach(link => {
    link.addEventListener("click", goToShop);
  });

  window.addEventListener("scroll", handleScrollEffects, { passive: true });

  document.addEventListener("DOMContentLoaded", () => {
    requestAnimationFrame(() => {
      setInitialLogoSetup();
      bigLogo.style.visibility = "visible";
      updateLogoOpacity();
      revealShopOnFirstScroll();
    });
  });

  window.addEventListener("resize", () => {
    updateSelectionBarPosition();
    updateLogoOpacity();
  });

  const swipeFrames = document.querySelectorAll(".product-image-frame.has-two-images");

  swipeFrames.forEach(frame => {
    const dots = frame.querySelectorAll(".dot");

    frame.addEventListener("scroll", () => {
      const maxScroll = frame.scrollWidth - frame.clientWidth;
      const secondActive = frame.scrollLeft > maxScroll / 2;

      dots.forEach(dot => dot.classList.remove("active"));

      if (secondActive) {
        dots[1].classList.add("active");
      } else {
        dots[0].classList.add("active");
      }
    });
  });
</script>
</body>
</html>

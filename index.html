<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LILAC</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <video autoplay muted loop playsinline class="header-video">
      <source src="./videos/Lilac Homepage Video.mp4" type="video/mp4">
    </video>

    <img src="./images/Logo Gold.png" class="logo-big">
  </header>

  <div class="selection-bar">
    <button class="menu-button" id="menuButton" aria-label="Open menu">
        ☰
    </button>

    <nav class="desktop-nav">
        <a href="#" class="nav-item">HOME</a>
        <a href="#" class="nav-item">SHOP</a>
        <a href="#" class="nav-item">
            <img src="./images/Logo.png" class="logo">
        </a>
        <a href="#" class="nav-item">DATES</a>
        <a href="#" class="nav-item">MEDIA</a>
    </nav>
  </div>

  <div class="side-menu" id="sideMenu">
    <button class="close-button" id="closeButton" aria-label="Close menu">
      ✕
    </button>

    <nav class="mobile-nav">
      <a href="#" class="nav-item-mobile">HOME</a>
      <a href="#" class="nav-item-mobile">SHOP</a>
      <a href="#" class="nav-item-mobile">DATES</a>
      <a href="#" class="nav-item-mobile">MEDIA</a>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="content"></div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const closeButton = document.getElementById("closeButton");
    const sideMenu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");

    function openMenu() {
      sideMenu.classList.add("open");
      overlay.classList.add("show");
    }

    function closeMenu() {
      sideMenu.classList.remove("open");
      overlay.classList.remove("show");
    }

    menuButton.addEventListener("click", openMenu);
    closeButton.addEventListener("click", closeMenu);
    overlay.addEventListener("click", closeMenu);
  </script>

</body>
</html>
